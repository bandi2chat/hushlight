<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hushlight</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hushlight">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#1B2240;--sf:#262F52;--ch:#2B3560;--bd:#3F4B78;--tx:#E8EEFF;--mu:#9AA6C7;--cy:#3DF2E0;--vi:#8B7BFF}
html,body{overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:max(36px,calc(env(safe-area-inset-top) + 16px)) max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-size:32px;line-height:1.15}
.logo{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:4px;color:var(--cy)}
.muted{color:var(--mu);font-size:15px;margin:0}
label{font-size:14px;color:var(--mu)}
input{height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 16px;font-size:17px;font-family:inherit}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{height:54px;border:0;border-radius:27px;background:linear-gradient(135deg,#3DF2E0,#8B7BFF);color:#0B0F1A;font-weight:800;font-size:17px;box-shadow:0 8px 22px -8px rgba(61,242,224,.5);transition:transform .12s,filter .15s}.btn:active,.send:active{transform:scale(.97)}button:disabled{opacity:.55}
.btn2{height:50px;border-radius:25px;border:1px solid var(--vi);background:transparent;color:#C9C2FF;font-size:16px}
.link{border:0;background:none;color:#B9B5FF;text-decoration:none;font-weight:600;font-size:15px;padding:8px}.link:active{opacity:.6}
.top .link,.chat-top #back{border:1px solid var(--bd);border-radius:16px;padding:7px 14px;background:rgba(255,255,255,.05);color:var(--tx);font-size:14px;font-weight:600;flex:none}
.tabs{display:flex;padding:4px;border-radius:24px;background:var(--sf)}
.tabs button{flex:1;padding:12px;border:0;border-radius:20px;background:transparent;color:var(--mu);font-weight:700;font-size:15px}
.tabs .on{background:var(--cy);color:#0B0F1A}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:20px;border:0;color:#0B0F1A;font-weight:700;font-size:14px}
.sw{width:44px;height:44px;border-radius:50%;border:0}
.sel{outline:3px solid var(--tx);outline-offset:2px}
.ava{width:48px;height:48px;border-radius:50%;border:3px solid;box-sizing:border-box;padding:3px;flex:none}
.ava i{display:flex;width:100%;height:100%;border-radius:50%;color:#0B0F1A;font-weight:700;align-items:center;justify-content:center;font-style:normal}
.row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ch)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{padding:12px 14px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);display:flex;gap:12px;align-items:center;text-align:left;color:var(--tx)}
.sec{font-size:14px;color:var(--mu);margin-top:10px}
.code{font-family:Orbitron,sans-serif;font-size:26px;letter-spacing:4px;text-align:center;padding:18px;border-radius:18px;background:var(--sf);border:2px solid var(--cy)}
.top{display:flex;justify-content:space-between;align-items:center}
.gear{border:0;background:var(--ch);border-radius:50%;width:36px;height:36px;font-size:18px;padding:0}
.acc{border:1px solid var(--bd);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--sf);padding:2px 16px;transition:border-color .2s}.acc[open]{border-color:rgba(139,123,255,.55)}.acc{margin:-4px 0}
.acc[open]{padding-bottom:16px}
.acc summary{padding:14px 0;font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.acc summary>span{flex:1}.acc summary .sv{font-style:normal;font-weight:500;font-size:13px;color:var(--mu)}.acc summary::after{content:'›';font-size:22px;line-height:1;color:var(--mu);transition:transform .2s}.acc[open] summary::after{transform:rotate(90deg)}
.acc summary::-webkit-details-marker{display:none}
.acc>*:not(summary){margin-top:10px}
.acc .btn2{width:100%}
.btn2{height:48px;border-radius:24px;border:1px solid rgba(139,123,255,.6);background:rgba(139,123,255,.1);color:#E4E0FF;font-size:15.5px;font-weight:700;transition:transform .12s}.btn2:active{transform:scale(.97)}
.btn2.pri{border:0;background:linear-gradient(135deg,#3DF2E0,#8B7BFF);color:#0B0F1A;font-weight:800;box-shadow:0 8px 22px -8px rgba(61,242,224,.55)}
.srow.danger{border-color:rgba(255,122,144,.5);background:rgba(255,122,144,.07)}.srow.danger .si2{background:rgba(255,122,144,.2)}.srow.danger b{color:#FFB3C0}
.btn2.danger{border-color:rgba(255,122,144,.6);background:rgba(255,122,144,.08);color:#FFB3C0}
.srow{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);text-align:left;font:inherit;transition:background .15s,transform .12s}
button.srow:active{transform:scale(.98);background:rgba(255,255,255,.08)}
.srow.static{cursor:default}
.si2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:rgba(139,123,255,.18);flex:none}
.srow .st{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.srow .st b{font-size:15.5px;font-weight:700}.srow .st small{color:var(--mu);font-size:12px;margin-top:2px}
.chev{font-style:normal;color:var(--mu);font-size:22px;line-height:1}
.srow>em{font-style:normal;color:var(--mu);font-size:14px}
.tgl{width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tgl.on{background:linear-gradient(135deg,#3DF2E0,#8B7BFF)}.tgl.on::after{transform:translateX(20px)}
.bdrow{display:flex;gap:10px;width:100%}.selw{position:relative;flex:1;min-width:0}.selw.sm{flex:0 0 38%}
.selw::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--cy);pointer-events:none;font-size:14px}
.selw select{width:100%;height:48px;border-radius:14px;border:1px solid rgba(61,242,224,.4);background:var(--bg);color:#fff;-webkit-text-fill-color:#fff;opacity:1;padding:0 34px 0 14px;font-size:16px;font-weight:600;font-family:inherit;-webkit-appearance:none;appearance:none;color-scheme:dark}
.ct{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;text-align:left}.ct b{font-size:16px}
.pv{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv i{font-style:normal}
.cm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.cm small{font-size:11px;color:var(--mu)}.cm .badge{margin-left:0;align-self:auto}
.q{font-size:13px;color:var(--mu)}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mchip{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:16px;padding:8px 14px;font-size:14px}
.mchip{font-weight:600;transition:transform .12s}.mchip:active{transform:scale(.96)}.mchip.on{background:linear-gradient(135deg,#3DF2E0,#8B7BFF);border-color:transparent;color:#0B0F1A;font-weight:800}
.day{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pic{display:block;max-width:100%;max-height:300px;min-height:100px;border-radius:12px;cursor:zoom-in;background:var(--ch)}
.hero{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:26px;background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(61,242,224,.14));border:1px solid var(--bd)}
.herobtn{border:0;background:none;padding:0;flex:none;border-radius:50%}
.herotxt{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.herotxt small{font-size:13px;color:var(--mu)}
.herotxt b{font-size:28px;line-height:1.05;font-weight:700;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.herotxt em{font-style:normal;font-size:12px;color:var(--mu)}
.pvbtns{display:flex;gap:12px;width:100%;max-width:360px;align-items:center;margin-top:6px}
.pvno,.pvok{height:58px;border-radius:29px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s}
.pvno:active,.pvok:active{transform:scale(.96)}
.pvno{flex:0 0 38%;border:1.5px solid #FF7A90;background:rgba(255,122,144,.10);color:#FFB3C0;font-weight:700}
.pvok{flex:1;border:0;background:linear-gradient(135deg,#3DF2E0,#8B7BFF);color:#0B0F1A;font-weight:800;box-shadow:0 10px 28px rgba(61,242,224,.28)}
.dock{position:sticky;bottom:0;display:flex;gap:12px;padding:18px 0 max(10px,env(safe-area-inset-bottom));margin-top:auto;background:linear-gradient(to bottom,rgba(27,34,64,0),var(--bg) 38%)}
.slogan{text-align:center;font-size:28px;line-height:1.15;margin:2px 0 0}
.gt{background:linear-gradient(90deg,#9FFFF3,#3DF2E0 40%,#8B7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.seals{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.seals span{font-size:12px;padding:6px 11px;border-radius:13px;background:rgba(43,53,96,.85)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fld{display:flex;align-items:center;gap:12px;height:54px;border-radius:27px;border:1px solid var(--bd);background:rgba(15,20,48,.72);padding:0 20px;font-size:16px}
.fld.cy{border-color:rgba(61,242,224,.55)}.fld.vi{border-color:rgba(139,123,255,.55)}
.fld input{flex:1;min-width:0;height:100%;border:0;border-radius:0;background:transparent;padding:0;color:var(--tx);font-size:16px;outline:none}
.fld input#code:not(:placeholder-shown){text-transform:uppercase;letter-spacing:3px}
#msg:empty{display:none}
.fld:focus-within{border-color:rgba(61,242,224,.85);box-shadow:0 0 0 3px rgba(61,242,224,.14)}
.btn.neon{height:58px;border-radius:29px;font-size:18px;font-weight:800;background:linear-gradient(135deg,#3DF2E0,#8B7BFF);box-shadow:0 0 0 3px rgba(61,242,224,.15),0 10px 28px rgba(61,242,224,.3)}
.swap{text-align:center;color:var(--mu);font-size:14px;margin:0}.swap button{border:0;background:none;color:var(--cy);font-weight:700;font-size:14px;padding:0}
.deck{background:var(--sf);border:1px solid var(--bd);border-radius:22px;overflow:hidden}
.dtabs{display:flex;background:rgba(0,0,0,.2)}
.dtab{flex:1;padding:13px 4px 11px;border:0;background:transparent;color:var(--mu);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 -3px 0 transparent;transition:box-shadow .2s,color .2s}
.dtab.on{color:var(--tx);background:var(--sf);box-shadow:inset 0 -3px 0 var(--cy)}
.dtab .cnt{background:var(--cy);color:#0B0F1A;border-radius:10px;padding:1px 7px;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cy)}.dot.warn{background:#FFB43A}
.dpanel{padding:14px;display:flex;flex-direction:column;gap:9px}
.qh{font-size:12px;color:var(--mu);letter-spacing:.5px}
.qt{display:flex;gap:12px;align-items:flex-start}.qt span{font-size:30px;line-height:1}.qt b{font-size:18px;line-height:1.3}
textarea{border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:12px;font:inherit;font-size:16px;resize:none;width:100%;box-sizing:border-box}
.qm{background:var(--ch);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.qm small{color:var(--mu);font-size:11px}.qm p,.qr p{margin:0;font-size:15px;overflow-wrap:anywhere}
.qr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ch)}.qr b{font-size:13px;color:var(--mu)}
.beat{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;padding:14px 16px;color:#0B0F1A;text-align:left;background:linear-gradient(135deg,#FF8FA3,#FFB43A)}
.beat .heart{font-size:34px;display:inline-block}.beat .heart.go{animation:latir .8s ease-out}
@keyframes latir{0%{transform:scale(1)}25%{transform:scale(1.45)}50%{transform:scale(1)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.beat b{display:block;font-size:19px;font-weight:800}.beat small{font-size:12px;opacity:.8}
.popt summary{color:var(--mu);font-size:13px;cursor:pointer;padding:4px 0}.popt{display:flex;flex-direction:column;gap:8px}
.swt{display:flex;gap:10px;align-items:flex-start;font-size:14px}.swt input{margin-top:3px;width:20px;height:20px;flex:none;accent-color:#3DF2E0}
.pr{display:flex;gap:10px;align-items:center;padding:6px 0}.pd{width:10px;height:10px;border-radius:50%;flex:none}.pd.ok{background:#7FD6C2}.pd.mid{background:#FFD27A}.pd.bad{background:#FF6B7A}
.mini{border:1px solid rgba(139,123,255,.6);background:rgba(139,123,255,.12);color:#E4E0FF;border-radius:16px;padding:8px 14px;font-size:13px;font-weight:700;flex:none}.mini:active{transform:scale(.96)}
.mn{font-size:20px;line-height:1;text-decoration:none;padding:0 6px}
.sheetbg{position:fixed;inset:0;z-index:9997;background:rgba(5,8,22,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--sf);border-radius:26px 26px 0 0;padding:10px 16px 22px;display:flex;flex-direction:column;gap:8px;animation:subir .22s ease-out}
@keyframes subir{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 6px}
.sheetq{color:var(--mu);font-size:13px;margin:0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sopt{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;border-radius:16px;background:var(--ch);color:var(--tx);text-align:left}
.sopt .si{font-size:22px;width:34px;text-align:center;flex:none}.sopt b{display:block;font-size:16px}.sopt small{color:var(--mu);font-size:12px}.sopt.danger b{color:#FF9AAB}
.sclose{border:0;background:none;color:var(--mu);padding:8px;font-size:15px}
.rchips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px}.rcust{display:flex;gap:8px;padding:2px 4px}.rcust input{flex:1;min-width:0;height:46px;font-size:16px}

@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,193,90,.8)}70%{box-shadow:0 0 0 9px rgba(255,193,90,0)}100%{box-shadow:0 0 0 0 rgba(255,193,90,0)}}
/* ---- Invitar: tarjetas de anillo ---- */
.ghost{height:50px;border-radius:25px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--mu);font-size:16px;font-weight:600}
.ghost:active{transform:scale(.97)}
.rings{display:flex;flex-direction:column;gap:12px}
.ringc{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);text-align:left;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.ringc:active{transform:scale(.98)}
.ringc .rico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(11,15,26,.6);border:1px solid rgba(255,255,255,.18);opacity:.75}
.ringc .rtx{display:flex;flex-direction:column;min-width:0;line-height:1.2}.ringc .rtx b{font-size:18px}.ringc .rtx small{color:var(--mu);font-size:12.5px;margin-top:2px}
.ringc .rck{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;color:transparent;border:1.5px solid var(--bd);flex:none;transition:all .2s}
.ringc.on{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.ringc.on .rico{opacity:1}.ringc.on .rck{color:#0B0F1A;border-color:transparent}
.ringc.nuc.on{border-color:rgba(255,128,96,.7);box-shadow:0 0 0 3px rgba(255,100,110,.12),0 12px 30px -12px rgba(255,76,96,.6)}
.ringc.nuc.on .rico{background:linear-gradient(140deg,#FF9A5A,#FF4D6D 60%,#D6246E);border-color:rgba(255,255,255,.4);box-shadow:0 6px 18px -4px rgba(255,76,96,.7)}
.ringc.nuc.on .rck{background:linear-gradient(140deg,#FF9A5A,#FF4D6D)}
.ringc.cer.on{border-color:rgba(61,242,224,.7);box-shadow:0 0 0 3px rgba(61,242,224,.12),0 12px 30px -12px rgba(77,141,255,.6)}
.ringc.cer.on .rico{background:linear-gradient(140deg,#2FE6D6,#4D8DFF 60%,#7B5CFF);border-color:rgba(255,255,255,.4);box-shadow:0 6px 18px -4px rgba(77,141,255,.7)}
.ringc.cer.on .rck{background:linear-gradient(140deg,#2FE6D6,#4D8DFF)}
.ticket{position:relative;border-radius:24px;padding:18px 16px 16px;text-align:center;background:linear-gradient(160deg,rgba(61,242,224,.14),rgba(139,123,255,.16));border:1px solid rgba(61,242,224,.5);box-shadow:0 0 0 3px rgba(61,242,224,.08),0 16px 36px -14px rgba(139,123,255,.7);animation:subir .3s ease-out;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid rgba(61,242,224,.5);transform:translateY(-50%)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.ticket small{color:var(--mu);font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.tcode{font-family:Orbitron,sans-serif;font-size:27px;font-weight:700;letter-spacing:4px;margin:8px 0 12px;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.tmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tmeta span{font-size:12px;padding:5px 10px;border-radius:12px;background:rgba(11,15,26,.45);color:#D9E3FF}

/* ---- Esto o aquello ---- */
.duobox{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.duoh{display:flex;align-items:center;justify-content:space-between}
.duovs{font-style:normal;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:2px;color:var(--mu)}
.duow{display:flex;gap:10px}
.duo{flex:1;min-height:74px;border:0;border-radius:20px;padding:10px 8px;color:#fff;font-size:16px;font-weight:700;line-height:1.2;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px -10px var(--g);transition:transform .15s,opacity .2s,filter .2s}
.duo.a{--g:rgba(255,76,96,.7);background:linear-gradient(140deg,#FF9A5A,#FF4D6D 60%,#D6246E)}
.duo.b{--g:rgba(110,100,255,.7);background:linear-gradient(140deg,#2FE6D6,#4D8DFF 55%,#7B5CFF)}
.duo:not(:disabled):active{transform:scale(.95)}
.duo.off{opacity:.38;filter:saturate(.5)}.duo.sel{box-shadow:0 0 0 3px #fff3,inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px -10px var(--g)}
.duo.sel::after{content:"✓";position:absolute;top:6px;right:9px;font-size:13px}
.duor{display:flex;flex-direction:column;gap:8px}
.duop{display:flex;align-items:center;gap:10px;font-size:14px}.duop span{flex:1;min-width:0}.duop em{font-style:normal;font-size:12px;color:var(--mu);white-space:nowrap}.duop em.ok{color:var(--cy);font-weight:700}

/* ---- Extras del chat ---- */
.xbtn{position:relative;margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.05);font-size:18px;flex:none}

="216" cy="216" r="121" fill="none" stroke="#3DF2E0" stroke-opacity=".55" stroke-width="7" filter="url(#glg)"/></g><circle cx="216" cy="216" r="120" fill="none" stroke="#3DF2E0" stroke-opacity=".4" stroke-width="2"/><path d="M341.5 256.8A132 132 0 0 1 261.1 340" fill="none" stroke="url(#tlg)" stroke-width="5" stroke-linecap="round"/><circle cx="261.1" cy="340" r="8" fill="#FFFFFF" filter="url(#flg)"/><g transform="translate(190 206)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-44 -64V62" stroke="#FFFFFF" stroke-width="24"/><path d="M20 -64V62H78" stroke="url(#llg)" stroke-width="24"/><path d="M4 -4H62" stroke="#0F1430" stroke-width="38"/><path d="M-44 -4H62" stroke="#FFFFFF" stroke-width="22"/><circle cx="78" cy="62" r="9" fill="#FFFFFF" stroke="none" filter="url(#flg)"/></g><text x="210" y="314" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="500" font-size="19" letter-spacing="8" fill="#9FFFF3">chat</text></svg>`;

let me = null, profile = null, tab = (urlCode ? 'crear' : 'entrar'), pendingError = '', inHome = false;

const R = html => { inHome = false; applyWall(); $('#app').className = ''; $('#app').innerHTML = html; };

async function boot() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return viewAuth();
    me = session.user;
    const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).single();
    if (error) throw error;
    profile = data;
    try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (tz && profile.tz !== tz) { profile.tz = tz; sb.from('profiles').update({ tz }).eq('id', me.id).then(() => {}); } } catch (_) {}
    if (!profile.display_name) return viewOnboarding();
    startSignals(); startMsgs();
    const code = sessionStorage.getItem('pending');
    if (code) {
      sessionStorage.removeItem('pending');
      const { data: d0, error: e } = await sb.rpc('redeem_invite', { p_code: code });

    R(`<div class="logo">HUSHLIGHT</div><p id="msg" role="status">No se pudo conectar: ${esc(e.message)}</p><button class="btn" id="retry">Reintentar</button>`);

function viewAuth() {

function viewOnboarding() {
  let color = COLORS[0], mood = 'calma';

function loadImg(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('No se pudo leer la imagen.')); }; im.src = u; }); }
async function shrink(file, max, square, q) {
  const im = await loadImg(file); let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m; }
  const k = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

function wallSvg(k) {
  const v = 'rgba(139,123,255,0.16)', c = 'rgba(61,242,224,0.13)', y = 'rgba(255,210,122,0.12)';
  const star = (x, yy, r, f) => `<path d="M${x} ${yy - r}L${x + r * .28} ${yy - r * .28}L${x + r} ${yy}L${x + r * .28} ${yy + r * .28}L${x} ${yy + r}L${x - r * .28} ${yy + r * .28}L${x - r} ${yy}L${x - r * .28} ${yy - r * .28}Z" fill="${f}"/>`;
  const moon = (x, yy, r, f) => `<path d="M${x} ${yy - r}A${r} ${r} 0 1 0 ${x} ${yy + r}A${r * .7} ${r * .7} 0 1 1 ${x} ${yy - r}Z" fill="${f}"/>`;
  const bub = (x, yy, f) => `<g fill="none" stroke="${f}" stroke-width="1.6" stroke-linejoin="round"><rect x="${x}" y="${yy}" width="16" height="11" rx="4"/><path d="M${x + 4} ${yy + 11}L${x + 3} ${yy + 15}L${x + 8} ${yy + 11}"/></g>`;
  let pat = '', w = 150, h = 90, rot = -24;
  if (k === 'hush' || k === 'nombre') {

    const t = esc(raw), est = raw.length * 9.5;
    w = Math.max(150, Math.round(est + 80)); h = 96;

    const half = Math.round(w / 2);

      star(Math.round(8 + est + 16), 24, 5, y) + bub(half - 30, 50, c) + bub(w - 34, 4, v) +
      star(Math.round(8 + half + est + 16 - w < 0 ? 8 + half + est + 16 : 8 + half + est + 16 - w), 72, 4, v);
  } else if (k === 'estrellas') {
    w = 140; h = 140; rot = 0;
    pat = star(22, 24, 7, v) + star(88, 62, 5, c) + star(48, 108, 4, y) + moon(112, 24, 8, c) + bub(14, 62, v) + bub(96, 104, c) +

    pat = `<g stroke="${v}" stroke-width="1" fill="none">${L.map(([i, j]) => `<line x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[j][0]}" y2="${P[j][1]}"/>`).join('')}</g>` +

  }

const VAPID_PUBLIC = 'BHhGUBE-_Vt2njlispRw50DLdh8OcqRRw65fNKe3qh1gyfFlWxUdWzFeB5FvwvSiGVhE97oupfDf63RNvU2kRjs';
const b64 = x => { const r = atob((x + '='.repeat((4 - x.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function pushState() {

  try {

let pushBusy = false;

    const reg = await navigator.serviceWorker.ready;

}

    o.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { o.querySelector('#cdate').value = b.dataset.d; o.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x === b)); });
    o.querySelector('#cgo').onclick = async () => {
      const body = o.querySelector('#cbody').value.trim(), dv = o.querySelector('#cdate').value, cm = o.querySelector('#cmsg');
      if (!body) return cm.textContent = 'Escribe el mensaje.';
      if (!dv) return cm.textContent = 'Elige la fecha en que se abrirá.';
      const at = new Date(dv + 'T08:00:00'); if (at <= new Date()) return cm.textContent = 'La fecha debe ser futura.';
      o.querySelector('#cgo').disabled = true;
      const { error } = await sb.from('capsules').insert({ recipient_id: other.id, body, unlock_at: at.toISOString() });
      if (error) { o.querySelector('#cgo').disabled = false; return cm.textContent = /10/.test(error.message) ? 'Ya tienes 10 cápsulas pendientes.' : 'No se pudo guardar: ' + error.message; }
      close(); msg('🔒 Cápsula sellada. Se abrirá el ' + fmtD(at) + ' a las 08:00.'); loadCaps();
    };
  };
  const openExtras = () => {
    const o = document.createElement('div'); o.className = 'sheetbg';
    const pend = caps.mine;
    o.innerHTML = `<div class="sheet" role="dialog" aria-label="Extras del chat"><div class="grab"></div>
      <div class="xhead"><span class="xic">✨</span><div><b>Extras</b><small>Con ${esc(other.display_name)}</small></div></div>
      <button class="sopt" data-a="fade"><span class="xic fade">🫥</span><span><b>Mensajes que se desvanecen</b><small>${fadeMs ? 'Activado · toca para cambiar' : 'Se borran solos para los dos'}</small></span></button>
      <div id="fopts" hidden><div class="rchips"><button class="mchip ${!fadeMs ? 'on' : ''}" data-f="0">Apagado</button><button class="mchip ${fadeMs === 36e5 ? 'on' : ''}" data-f="36e5">1 hora</button><button class="mchip ${fadeMs === 864e5 ? 'on' : ''}" data-f="864e5">24 horas</button></div></div>
      <button class="sopt" data-a="cap"><span class="xic cap">⏳</span><span><b>Cápsula del tiempo</b><small>Un mensaje que se abre en el futuro</small></span></button>
      <button class="sopt" data-a="clr"><span class="xic" style="background:linear-gradient(140deg,#FF9A5A,#FF4D6D)">🧹</span><span><b>Vaciar chat</b><small>Solo aquí o también para todos</small></span></button>
      ${pend.length ? `<p class="sheetq" style="margin-top:4px">⏳ Cápsulas que enviaste (${pend.length})</p>${pend.map(c => `<div class="capitem"><span>🔒 Se abre el ${esc(fmtD(c.unlock_at))}</span><button class="link" data-del="${c.id}" aria-label="Eliminar cápsula">🗑️</button></div>`).join('')}` : ''}
      <button class="sclose" data-a="close">Cerrar</button></div>`;
    document.body.appendChild(o); const close = () => o.remove();
    o.onclick = e => { if (e.target === o) close(); };
    o.querySelector('[data-a="close"]').onclick = close;
    o.querySelector('[data-a="cap"]').onclick = () => { close(); newCapsule(); };
    o.querySelector('[data-a="clr"]').onclick = () => { close(); openClear(); };
    o.querySelector('[data-a="fade"]').onclick = () => { const f = o.querySelector('#fopts'); f.hidden = !f.hidden; };
    o.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { setFade(+b.dataset.f); close(); });
    o.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('¿Eliminar esta cápsula?')) return; await sb.from('capsules').delete().eq('id', b.dataset.del); close(); loadCaps(); });
  };
  $('#xtra').onclick = openExtras;
  loadCaps(); capT = setInterval(() => { if (!left) loadCaps(); }, 60000);
  let rec = null, chunks = [], timer = null, t0 = 0;
  const micBtn = $('#mic'), cancelBtn = $('#cancel');
  const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  const sendAudio = async blob => {
    if (blob.size < 1000) return msg('El audio es muy corto.');
    const base = (blob.type || 'audio/webm').split(';')[0];
    const ext = base.includes('mp4') ? 'm4a' : base.includes('ogg') ? 'ogg' : base.includes('mpeg') ? 'mp3' : 'webm';
    const path = `${conv.id}/${crypto.randomUUID()}.${ext}`;
    msg('Enviando audio…');
    const up = await sb.storage.from('audios').upload(path, blob, { contentType: base });
    if (up.error) return msg('No se pudo subir: ' + up.error.message);
    const { data, error } = await sb.from('messages').insert({ conversation_id: conv.id, sender_id: me.id, kind: 'audio', audio_path: path, reply_to: replying ? replying.id : null }).select().single();
    if (error) return msg(error.message);
    msg(''); clearReply(); seen.set(data.id, data); draw(); $('#msgs').scrollTop = $('#msgs').scrollHeight;
  };
  const uploadImage = async blob => {
    const path = `${conv.id}/${crypto.randomUUID()}.jpg`;
    msg('Enviando foto…');
    const up = await sb.storage.from('images').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) return msg('No se pudo subir: ' + up.error.message);
    const { data, error } = await sb.from('messages').insert({ conversation_id: conv.id, sender_id: me.id, kind: 'image', audio_path: path, reply_to: replying ? replying.id : null }).select().single();
    if (error) { sb.storage.from('images').remove([path]); return msg(error.message); }
    msg(''); clearReply(); seen.set(data.id, data); draw(); $('#msgs').scrollTop = $('#msgs').scrollHeight;
  };
  const sendImage = async file => {
    msg('Preparando foto…');
    let blob; try { blob = await shrink(file, 1280, false, 0.72); } catch (e) { return msg(e.message); }
    if (!blob || blob.size > 2000000) return msg('La foto es demasiado pesada.');
    msg('');
    const url = URL.createObjectURL(blob);
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:9997;background:rgba(8,11,28,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box';
    o.innerHTML = `<p class="muted" style="margin:0">Vista previa · se enviará a ${esc(other.display_name)}</p>
      <img src="${url}" alt="Vista previa" style="max-width:100%;max-height:58vh;border-radius:20px;box-shadow:0 0 0 1px var(--bd),0 14px 44px rgba(139,123,255,.35)">
      <p class="muted" style="margin:0">${Math.round(blob.size / 1024)} KB</p>
      <div class="pvbtns"><button class="pvno" id="pvno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Cancelar</button><button class="pvok" id="pvok">Enviar<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg></button></div>`;
    document.body.appendChild(o);
    const close = () => { o.remove(); URL.revokeObjectURL(url); };
    o.querySelector('#pvno').onclick = close;
    o.querySelector('#pvok').onclick = () => { close(); uploadImage(blob); };
  };
  $('#photo').onclick = () => $('#imgfile').click();
  $('#imgfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) sendImage(f); };
  const startRec = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) return msg('Este navegador no permite grabar audio.');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return msg('Permite el micrófono en el navegador para grabar.'); }
    chunks = [];
    const r = new MediaRecorder(stream); rec = r;
    r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    r.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(timer); timer = null;
      micBtn.textContent = 'Grabar'; micBtn.classList.remove('rec'); cancelBtn.hidden = true;
      if (!r.cancelled) await sendAudio(new Blob(chunks, { type: r.mimeType }));
    };
    r.start(); t0 = Date.now(); msg('');
    micBtn.classList.add('rec'); micBtn.textContent = 'Enviar · 0:00'; cancelBtn.hidden = false;
    timer = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      micBtn.textContent = 'Enviar · ' + fmt(sec);
      if (sec >= 60) r.stop();
    }, 250);
  };
  micBtn.onclick = () => { if (rec && rec.state === 'recording') rec.stop(); else startRec(); };
  cancelBtn.onclick = () => { if (rec && rec.state === 'recording') { rec.cancelled = true; rec.stop(); } };
  $('#send').onpointerdown = e => e.preventDefault(); // mantiene el teclado abierto
  $('#send').onclick = send;
  $('#txt').onkeydown = e => { if (e.key === 'Enter') send(); };
  $('#back').onclick = () => { if (rec && rec.state === 'recording') { rec.cancelled = true; rec.stop(); } left = true; clearInterval(poll); clearInterval(safety); clearInterval(capT); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', wake); window.removeEventListener('focus', wake); sb.removeChannel(ch); viewHome(); };
}

// ---- Bloqueo con PIN (se guarda solo en este dispositivo) ----
const PIN_KEY = 'hl_pin', LOCK_AFTER = 30000;
const pinGet = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY)); } catch (_) { return null; } };
const pinPut = o => { try { localStorage.setItem(PIN_KEY, JSON.stringify(o)); } catch (_) {} };
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
async function pinHash(pin, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 150000, hash: 'SHA-256' }, k, 256));
}
async function pinSave(pin) { const salt = hex(crypto.getRandomValues(new Uint8Array(16))); pinPut({ salt, hash: await pinHash(pin, salt), fails: 0, until: 0 }); }
// Devuelve '' si el PIN es correcto, o el mensaje de error.
async function pinCheck(pin) {
  const p = pinGet(); if (!p) return '';
  const wait = (p.until || 0) - Date.now();
  if (wait > 0) return 'Demasiados intentos. Espera ' + Math.ceil(wait / 1000) + ' segundos.';
  if (await pinHash(pin, p.salt) === p.hash) { p.fails = 0; p.until = 0; pinPut(p); return ''; }
  p.fails = (p.fails || 0) + 1;
  if (p.fails >= 5) p.until = Date.now() + 30000 * (p.fails - 4);
  pinPut(p);
  return p.fails >= 5 ? 'PIN incorrecto. Espera un momento antes de intentar de nuevo.' : 'PIN incorrecto.';
}
let locked = false, hiddenAt = 0;
function showLock() {
  if (!pinGet() || locked) return; locked = true;
  const o = document.createElement('div'); o.id = 'lock';
  o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;max-width:430px;margin:0 auto';
  o.innerHTML = `<div class="logo">HUSHLIGHT</div><h1>Escribe tu PIN.</h1>
    <input id="lpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN" style="text-align:center;letter-spacing:8px;font-size:24px">
    <p id="lmsg" role="status" class="muted"></p>
    <button class="btn" id="lgo">Desbloquear</button>
    <button class="link" id="lforgot">Olvidé mi PIN</button>`;
  document.body.appendChild(o);
  const inp = o.querySelector('#lpin'), m = o.querySelector('#lmsg');
  setTimeout(() => inp.focus(), 50);
  const go = async () => {
    const e = await pinCheck(inp.value);
    if (e) { m.textContent = e; inp.value = ''; return; }
    o.remove(); locked = false; hiddenAt = 0;
  };
  o.querySelector('#lgo').onclick = go;
  inp.onkeydown = ev => { if (ev.key === 'Enter') go(); };
  o.querySelector('#lforgot').onclick = async () => {
    if (!confirm('Se cerrará tu sesión en este dispositivo y se quitará el PIN. Podrás volver a entrar con tu correo y contraseña. ¿Continuar?')) return;
    stopSignals(); try { await sb.auth.signOut(); } catch (_) {}
    try { localStorage.removeItem(PIN_KEY); } catch (_) {}
    o.remove(); locked = false; tab = 'entrar'; boot();
  };
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > LOCK_AFTER) showLock();
});
function viewPin() {
  const has = !!pinGet();
  R(`<div class="logo">PIN</div>
  <h1>${has ? 'Tu PIN de bloqueo.' : 'Crea un PIN.'}</h1>
  <p class="muted">Hushlight pedirá el PIN al abrirla y al volver a ella después de unos segundos. Se guarda solo en este dispositivo.</p>
  ${has ? '<label for="p0">PIN actual</label><input id="p0" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">' : ''}
  <label for="p1">${has ? 'PIN nuevo' : 'PIN'} (4 a 6 números)</label>
  <input id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
  <label for="p2">Repite el PIN</label>
  <input id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
  <p id="msg" role="status"></p>
  <button class="btn" id="psave">Guardar PIN</button>
  ${has ? '<button class="btn2 danger" id="pdel">Quitar PIN</button>' : ''}
  <button class="ghost" id="back">Volver</button>`);
  $('#back').onclick = goBack;
  $('#psave').onclick = async () => {
    if (has) { const e = await pinCheck($('#p0').value); if (e) return msg(e); }
    const a = $('#p1').value, b = $('#p2').value;
    if (!/^\d{4,6}$/.test(a)) return msg('El PIN debe tener de 4 a 6 números.');
    if (a !== b) return msg('Los dos PIN no coinciden.');
    await pinSave(a); pendingError = 'PIN guardado.'; goBack();
  };
  if (has) $('#pdel').onclick = async () => {
    const e = await pinCheck($('#p0').value); if (e) return msg(e);
    try { localStorage.removeItem(PIN_KEY); } catch (_) {}
    pendingError = 'PIN quitado.'; goBack();
  };
}
applyWall();
showLock();

boot();
</script>
