<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushlight</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hushlight">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#1B2240;--sf:#262F52;--ch:#2B3560;--bd:#3F4B78;--tx:#E8EEFF;--mu:#9AA6C7;--cy:#3DF2E0;--vi:#8B7BFF}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:48px 24px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-size:32px;line-height:1.15}
.logo{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:4px;color:var(--cy)}
.muted{color:var(--mu);font-size:15px;margin:0}
label{font-size:14px;color:var(--mu)}
input{height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 16px;font-size:17px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.btn{height:54px;border:0;border-radius:27px;background:var(--cy);color:#0B0F1A;font-weight:700;font-size:17px}
.btn2{height:50px;border-radius:25px;border:1px solid var(--vi);background:transparent;color:#C9C2FF;font-size:16px}
.link{border:0;background:none;color:var(--mu);text-decoration:underline;font-size:15px;padding:8px}
.tabs{display:flex;padding:4px;border-radius:24px;background:var(--sf)}
.tabs button{flex:1;padding:12px;border:0;border-radius:20px;background:transparent;color:var(--mu);font-weight:700;font-size:15px}
.tabs .on{background:var(--cy);color:#0B0F1A}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:20px;border:0;color:#0B0F1A;font-weight:700;font-size:14px}
.sw{width:44px;height:44px;border-radius:50%;border:0}
.sel{outline:3px solid var(--tx);outline-offset:2px}
.ava{width:48px;height:48px;border-radius:50%;border:3px solid;box-sizing:border-box;padding:3px;flex:none}
.ava i{display:flex;width:100%;height:100%;border-radius:50%;color:#0B0F1A;font-weight:700;align-items:center;justify-content:center;font-style:normal}
.row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ch)}
.cards{display:flex;gap:12px}
.card{flex:1;padding:16px;border-radius:22px;background:var(--sf);border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sec{font-size:14px;color:var(--mu);margin-top:10px}
.code{font-family:Orbitron,sans-serif;font-size:26px;letter-spacing:4px;text-align:center;padding:18px;border-radius:18px;background:var(--sf);border:2px solid var(--cy)}
.top{display:flex;justify-content:space-between;align-items:center}
.mood{font-size:13px;padding:6px 12px;border-radius:14px;background:var(--ch);color:#C9C2FF}
#msg{margin:0;min-height:20px;font-size:14px;color:#FFD27A}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
button.row{background:none;border:0;border-bottom:1px solid var(--ch);font:inherit;color:inherit;width:100%;text-align:left}
button.card{font:inherit;color:inherit;text-align:left;align-items:flex-start}
#app.full{height:100dvh;padding:12px 14px;gap:8px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px}
.chat-top{display:flex;align-items:center;gap:12px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.b{max-width:75%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.b small{display:block;font-size:11px;margin-top:4px;opacity:.85}
.b.me{align-self:flex-end;color:#0B0F1A;border-bottom-right-radius:4px}
.b.ot{align-self:flex-start;background:var(--ch);border-bottom-left-radius:4px}
.bar{display:flex;gap:8px}
.bar input{flex:1;min-width:0;border-radius:27px}
.send.rec{background:#FF7A90}
audio{max-width:100%;height:40px}
.send{height:54px;padding:0 16px;border:0;border-radius:27px;background:var(--cy);color:#0B0F1A;font-weight:700;font-size:16px}
#alerts{position:sticky;top:0;z-index:10}
.alert{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-weight:700;color:#0B0F1A}
.alert.help{background:#FF7A90}.alert.ok{background:#7FD6C2}.alert.nophone{background:#FFD27A}
.alert button{border:0;border-radius:16px;padding:8px 14px;background:#0B0F1A;color:#fff;font-weight:700}
.b small{display:flex;gap:10px;align-items:center}
.rp{border:0;background:none;color:inherit;font-size:11px;text-decoration:underline;padding:4px 0;opacity:.9}
.quote{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:6px;font-size:13px;opacity:.85;cursor:pointer}
.flash{outline:2px solid var(--cy)}
.replybar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--sf);border-left:4px solid var(--cy);font-size:13px;color:var(--mu)}
.replybar[hidden]{display:none}
.day{align-self:center;font-size:12px;color:var(--mu);background:var(--sf);padding:4px 12px;border-radius:12px;margin:6px 0}
.badge{background:var(--cy);color:#0B0F1A;border-radius:12px;min-width:22px;padding:2px 8px;font-size:12px;font-weight:700;text-align:center;margin-left:auto;align-self:flex-start}
</style>
</head>
<body>
<div id="alerts" role="alert"></div>
<main id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.js"></script>
<script>
// Datos públicos del proyecto (la seguridad la dan las reglas de la base de datos)
const SUPABASE_URL = 'https://vijqxljcyzrvkoxzahwe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CvLkBVcd7PnT9TXDUiQ-aQ_pQ3wKbSV';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const logoSvg = w => `<svg viewBox="0 0 400 400" width="${w}" height="${w}" role="img" aria-label="Hushlight"><defs><linearGradient id="alg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FFFF3"/><stop offset=".5" stop-color="#3DF2E0"/><stop offset="1" stop-color="#8B7BFF"/></linearGradient><radialGradient id="blg" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="#3DF2E0" stop-opacity=".4"/><stop offset="1" stop-color="#3DF2E0" stop-opacity="0"/></radialGradient><linearGradient id="tlg" gradientUnits="userSpaceOnUse" x1="341.5" y1="256.8" x2="261.1" y2="340"><stop offset="0" stop-color="#3DF2E0" stop-opacity="0"/><stop offset="1" stop-color="#9FFFF3" stop-opacity=".95"/></linearGradient><filter id="flg" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="200" cy="200" r="190" fill="url(#blg)"/><path d="M47.4 159.1A158 158 0 0 1 159.1 47.4" fill="none" stroke="#3DF2E0" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/><path d="M28.1 153.9A178 178 0 0 1 153.9 28.1" fill="none" stroke="#3DF2E0" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="200" r="136" fill="url(#alg)"/><circle cx="216" cy="216" r="120" fill="#0F1430" stroke="#3DF2E0" stroke-opacity=".4" stroke-width="2"/><path d="M341.5 256.8A132 132 0 0 1 261.1 340" fill="none" stroke="url(#tlg)" stroke-width="5" stroke-linecap="round"/><circle cx="261.1" cy="340" r="8" fill="#FFFFFF" filter="url(#flg)"/><g transform="translate(208 205) scale(.92)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"><path d="M-8 -50V20Q-8 40 12 40H64" stroke="#9FFFF3"/><path d="M-56 -58V58" stroke="#FFFFFF"/><path d="M-56 14C-56 -12 -40 -32 -8 -32C24 -32 40 -12 40 14V58" stroke="#FFFFFF"/><path d="M-8 -46V-18" stroke="#0F1430" stroke-width="34"/><path d="M-8 -50V-6" stroke="#9FFFF3"/><path d="M40 24V56" stroke="#0F1430" stroke-width="34"/><path d="M40 14V58" stroke="#FFFFFF"/><circle cx="64" cy="40" r="10" fill="#FFFFFF" stroke="none" filter="url(#flg)"/></g><text x="216" y="298" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="500" font-size="16" letter-spacing="7" fill="#9FFFF3">chat</text></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#3DF2E0','#8B7BFF','#F2B8FF','#FFD27A','#FF7A90'];
const MOODS = {calma:['Calma','#7FD6C2'], enfocado:['Enfocado','#3DF2E0'], energia:['Energía','#FFD27A'], noche:['Noche','#8B7BFF']};
const ERR = {
  'User already registered':'Ese correo ya tiene cuenta. Usa «Ya tengo cuenta».',
  'Invalid login credentials':'Correo o contraseña incorrectos.',
  'Email not confirmed':'Falta confirmar el correo.'
};
const urlCode = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
let installEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; if (inHome) viewHome(); });
const isIOS = /iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone;
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
let me = null, profile = null, tab = 'crear', pendingError = '', inHome = false;

const R = html => { inHome = false; $('#app').className = ''; $('#app').innerHTML = html; };
const msg = t => { const m = $('#msg'); if (m) m.textContent = t || ''; };
const fail = e => msg(ERR[e.message] || e.message);
const ava = (p, size) => `<div class="ava" style="border-color:${esc(p.color)};${size?`width:${size}px;height:${size}px`:''}"><i style="background:${esc(p.color)}">${esc((p.display_name||'?').charAt(0).toUpperCase())}</i></div>`;

async function boot() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return viewAuth();
    me = session.user;
    const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).single();
    if (error) throw error;
    profile = data;
    if (!profile.display_name) return viewOnboarding();
    startSignals(); startMsgs();
    const code = sessionStorage.getItem('pending');
    if (code) {
      sessionStorage.removeItem('pending');
      const { error: e } = await sb.rpc('redeem_invite', { p_code: code });
      pendingError = e ? e.message : '';
    }
    viewHome();
  } catch (e) {
    R(`<div class="logo">HUSHLIGHT</div><p id="msg" role="status">No se pudo conectar: ${esc(e.message)}</p><button class="btn" id="retry">Reintentar</button>`);
    $('#retry').onclick = boot;
  }
}

function viewAuth() {
  const crear = tab === 'crear';
  R(`<div style="align-self:center;margin-top:-16px">${logoSvg(210)}</div>
  <div class="logo" style="text-align:center;margin-top:-18px">HUSHLIGHT</div>
  <h1>Entra con tu código, no con tu número.</h1>
  <p class="muted">Tu círculo íntimo, disponible en cualquier navegador.</p>
  <div class="tabs"><button id="t1" class="${crear?'on':''}">Crear cuenta</button><button id="t2" class="${crear?'':'on'}">Ya tengo cuenta</button></div>
  ${crear ? `<label for="code">Código de invitación (si tienes uno)</label>
  <input id="code" value="${esc(urlCode)}" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;text-align:center">` : ''}
  <label for="em">Correo</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Contraseña (mínimo 8 caracteres)</label><input id="pw" type="password" autocomplete="${crear?'new-password':'current-password'}">
  <p id="msg" role="status"></p>
  <button class="btn" id="go">${crear?'Crear cuenta':'Entrar'}</button>`);
  $('#t1').onclick = () => { tab = 'crear'; viewAuth(); };
  $('#t2').onclick = () => { tab = 'entrar'; viewAuth(); };
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), pw = $('#pw').value;
    if (!email || pw.length < 8) return msg('Escribe un correo y una contraseña de al menos 8 caracteres.');
    $('#go').disabled = true; msg('');
    if (crear) {
      const { data, error } = await sb.auth.signUp({ email, password: pw });
      if (error) { $('#go').disabled = false; return fail(error); }
      if (!data.session) { $('#go').disabled = false; return msg('Revisa tu correo para confirmar la cuenta.'); }
      const code = $('#code').value.trim();
      if (code) sessionStorage.setItem('pending', code);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) { $('#go').disabled = false; return fail(error); }
    }
    boot();
  };
}

function viewOnboarding() {
  let color = COLORS[0], mood = 'calma';
  R(`<div class="logo">HUSHLIGHT</div>
  <h1>Cuéntanos quién eres.</h1>
  <div id="prev" style="align-self:center;margin:6px 0"></div>
  <label for="nm">¿Cómo te llaman?</label><input id="nm" maxlength="30" autocomplete="nickname">
  <div class="sec">Tu color</div>
  <div class="chips" id="sws">${COLORS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
  <div class="sec">¿Cómo estás hoy?</div>
  <div class="chips" id="mds">${Object.entries(MOODS).map(([k,[n,c]])=>`<button class="chip" data-m="${k}" style="background:${c}">${n}</button>`).join('')}</div>
  <p id="msg" role="status"></p>
  <button class="btn" id="go">Empezar</button>`);
  const paint = () => {
    $('#prev').innerHTML = ava({ display_name: $('#nm').value || '?', color }, 96);
    document.querySelectorAll('.sw').forEach(b => b.classList.toggle('sel', b.dataset.c === color));
    document.querySelectorAll('.chip').forEach(b => b.classList.toggle('sel', b.dataset.m === mood));
  };
  $('#nm').oninput = paint;
  $('#sws').onclick = e => { const b = e.target.closest('.sw'); if (b) { color = b.dataset.c; paint(); } };
  $('#mds').onclick = e => { const b = e.target.closest('.chip'); if (b) { mood = b.dataset.m; paint(); } };
  paint();
  $('#go').onclick = async () => {
    const display_name = $('#nm').value.trim();
    if (!display_name) return msg('Escribe cómo te llaman.');
    const { error } = await sb.from('profiles').update({ display_name, color, mood }).eq('id', me.id);
    if (error) return fail(error);
    boot();
  };
}

async function viewHome() {
  const { data, error } = await sb.from('contacts')
    .select('ring, profiles!contacts_contact_fkey(id, display_name, color, mood)').eq('owner', me.id);
  const { data: un } = await sb.from('messages').select('sender_id').neq('sender_id', me.id).neq('status', 'read').is('deleted_at', null).limit(1000);
  const unread = {}; (un || []).forEach(x => { unread[x.sender_id] = (unread[x.sender_id] || 0) + 1; });
  const badge = c => unread[c.profiles.id] ? `<span class="badge">${unread[c.profiles.id]}</span>` : '';
  const list = (data || []).filter(c => c.profiles);
  const nuc = list.filter(c => c.ring === 'nucleo'), cer = list.filter(c => c.ring !== 'nucleo');
  const card = c => `<button class="card" data-i="${list.indexOf(c)}">${ava(c.profiles, 64)}<b style="font-size:17px">${esc(c.profiles.display_name)}</b><span class="muted" style="color:${esc(c.profiles.color)}">${esc((MOODS[c.profiles.mood]||['—'])[0])}</span>${badge(c)}</button>`;
  const row = c => `<button class="row" data-i="${list.indexOf(c)}">${ava(c.profiles)}<div><b>${esc(c.profiles.display_name)}</b><div class="muted">${esc((MOODS[c.profiles.mood]||['—'])[0])}</div></div>${badge(c)}</button>`;
  R(`<div class="top"><span class="logo">HUSHLIGHT</span><span class="mood">${esc((MOODS[profile.mood]||['Calma'])[0])}</span></div>
  <h1>Hola, ${esc(profile.display_name)}.</h1>
  ${error ? `<p id="msg">${esc(error.message)}</p>` : '<p id="msg" role="status">' + esc(pendingError) + '</p>'}
  ${list.length === 0 ? '<p class="muted">Aún no tienes a nadie en tu círculo. Genera un código e invita a la primera persona.</p>' : ''}
  ${nuc.length ? `<div class="sec">Núcleo</div><div class="cards">${nuc.map(card).join('')}</div>` : ''}
  ${cer.length ? `<div class="sec">Cercanos</div>${cer.map(row).join('')}` : ''}
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <button class="btn" id="sos" style="background:#FFB43A">SOS · avisar a mi Núcleo</button>
    <button class="btn" id="inv">Invitar a alguien</button>
    <button class="btn2" id="red">Tengo un código</button>
    ${installEv ? '<button class="btn2" id="inst">Instalar Hushlight en este dispositivo</button>' : ''}
    ${isIOS ? '<p class="muted" style="text-align:center">En iPhone: toca Compartir y luego «Agregar a pantalla de inicio».</p>' : ''}
    <button class="link" id="out">Salir</button>
  </div>`);
  pendingError = ''; inHome = true;
  document.querySelectorAll('[data-i]').forEach(b => b.onclick = () => viewChat(list[+b.dataset.i].profiles));
  $('#sos').onclick = viewSOS;
  if ($('#inst')) $('#inst').onclick = async () => { installEv.prompt(); await installEv.userChoice; installEv = null; viewHome(); };
  $('#inv').onclick = viewInvite;
  $('#red').onclick = viewRedeem;
  $('#out').onclick = async () => { stopSignals(); await sb.auth.signOut(); tab = 'entrar'; boot(); };
}

function viewInvite() {
  let ring = 'nucleo';
  R(`<div class="logo">INVITAR</div>
  <h1>Invita a tu círculo.</h1>
  <p class="muted">El Núcleo recibirá tus señales de emergencia. Podrás cambiarlo después.</p>
  <div class="tabs"><button id="r1" class="on">Núcleo</button><button id="r2">Cercano</button></div>
  <div id="out"></div>
  <p id="msg" role="status"></p>
  <button class="btn" id="gen">Generar código</button>
  <button class="link" id="back">Volver</button>`);
  const set = r => { ring = r; $('#r1').classList.toggle('on', r === 'nucleo'); $('#r2').classList.toggle('on', r === 'cercano'); };
  $('#r1').onclick = () => set('nucleo'); $('#r2').onclick = () => set('cercano');
  $('#back').onclick = viewHome;
  $('#gen').onclick = async () => {
    const { data, error } = await sb.rpc('create_invite', { p_ring: ring });
    if (error) return fail(error);
    $('#out').innerHTML = `<div class="code">${esc(data)}</div><p class="muted" style="text-align:center;margin-top:8px">Caduca en 24 horas · un solo uso</p>`;
    $('#gen').textContent = 'Copiar código';
    $('#gen').onclick = async () => { try { await navigator.clipboard.writeText(data); msg('Código copiado.'); } catch { msg('Cópialo a mano: ' + data); } };
  };
}

function viewRedeem() {
  R(`<div class="logo">CÓDIGO</div>
  <h1>Usa un código de invitación.</h1>
  <label for="code">Código</label>
  <input id="code" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;text-align:center">
  <p id="msg" role="status"></p>
  <button class="btn" id="go">Unirme</button>
  <button class="link" id="back">Volver</button>`);
  $('#back').onclick = viewHome;
  $('#go').onclick = async () => {
    const code = $('#code').value.trim();
    if (!code) return msg('Escribe el código.');
    const { error } = await sb.rpc('redeem_invite', { p_code: code });
    if (error) return fail(error);
    viewHome();
  };
}

let msgCh = null;
function startMsgs() {
  if (msgCh) return;
  sb.from('messages').update({ status: 'delivered' }).neq('sender_id', me.id).eq('status', 'sent').then(() => {});
  msgCh = sb.channel('msgs-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
      const m = p.new; if (!m || m.sender_id === me.id) return;
      sb.from('messages').update({ status: 'delivered' }).eq('id', m.id).eq('status', 'sent').then(() => {});
      if (inHome) viewHome();
    }).subscribe();
}
const SIG = { help: 'necesita ayuda', ok: 'está bien', nophone: 'no tiene su celular, escríbele aquí' };
let sigCh = null;
function startSignals() {
  if (sigCh) return;
  refreshSignals();
  sigCh = sb.channel('signals-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'signal_recipients', filter: `recipient_id=eq.${me.id}` }, refreshSignals)
    .subscribe();
}
function stopSignals() {
  if (sigCh) { sb.removeChannel(sigCh); sigCh = null; }
  if (msgCh) { sb.removeChannel(msgCh); msgCh = null; }
  const b = $('#alerts'); if (b) b.innerHTML = '';
}
async function refreshSignals() {
  const box = $('#alerts'); if (!box || !me) return;
  const { data } = await sb.from('signal_recipients')
    .select('signal_id, signals(kind, created_at), sender:profiles!signal_recipients_sender_id_fkey(display_name)')
    .eq('recipient_id', me.id).eq('status', 'sent');
  box.innerHTML = '';
  (data || []).forEach(r => {
    if (!r.signals) return;
    const d = document.createElement('div'); d.className = 'alert ' + r.signals.kind;
    const t = document.createElement('span');
    const hora = new Date(r.signals.created_at).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    t.textContent = (r.sender ? r.sender.display_name : 'Alguien') + ' ' + (SIG[r.signals.kind] || '') + ' · ' + hora;
    const b = document.createElement('button'); b.textContent = 'Entendido';
    b.onclick = async () => { await sb.rpc('read_signal', { p_id: r.signal_id }); refreshSignals(); };
    d.append(t, b); box.appendChild(d);
  });
}

function viewSOS() {
  const KINDS = { help: ['Necesito ayuda', '#FF7A90'], ok: ['Estoy bien', '#7FD6C2'], nophone: ['Sin celular, escríbeme aquí', '#FFD27A'] };
  let kind = 'help', iv = null;
  R(`<div class="logo" style="color:#FFB43A">SEÑAL AL NÚCLEO</div>
  <h1>Avisa a tu Núcleo.</h1>
  <p class="muted">Lo verán en cuanto abran Hushlight. Por ahora no suena si la app está cerrada.</p>
  <div class="chips" id="kinds">${Object.entries(KINDS).map(([k, [n, c]]) => `<button class="chip" data-k="${k}" style="background:${c}">${n}</button>`).join('')}</div>
  <div id="who" style="margin-top:6px"></div>
  <p id="msg" role="status"></p>
  <button class="btn" id="go" style="background:#FFB43A">Enviar señal</button>
  <button class="link" id="back">Volver</button>`);
  const paint = () => document.querySelectorAll('#kinds .chip').forEach(b => b.classList.toggle('sel', b.dataset.k === kind));
  $('#kinds').onclick = e => { const b = e.target.closest('.chip'); if (b) { kind = b.dataset.k; paint(); } };
  paint();
  const showWho = async sid => {
    const { data } = await sb.from('signal_recipients')
      .select('status, profiles!signal_recipients_recipient_id_fkey(display_name, color)').eq('signal_id', sid);
    const box = $('#who'); if (!box) return;
    box.innerHTML = (data || []).map(r => `<div class="row">${ava(r.profiles || { display_name: '?', color: '#9AA6C7' })}<b>${esc(r.profiles ? r.profiles.display_name : '')}</b><span class="muted" style="margin-left:auto">${r.status === 'read' ? '✓✓ Visto' : '✓ Enviado'}</span></div>`).join('');
  };
  $('#go').onclick = async () => {
    if (!confirm('¿Enviar «' + KINDS[kind][0] + '» a tu Núcleo?')) return;
    $('#go').disabled = true; msg('');
    const { data, error } = await sb.rpc('send_signal', { p_kind: kind });
    $('#go').disabled = false;
    if (error) return fail(error);
    msg('Señal enviada.'); showWho(data);
    clearInterval(iv); iv = setInterval(() => showWho(data), 3000);
  };
  $('#back').onclick = () => { clearInterval(iv); viewHome(); };
}

async function viewChat(other) {
  const { data: conv, error: ce } = await sb.from('conversations').select('id')
    .or(`and(user_a.eq.${me.id},user_b.eq.${other.id}),and(user_a.eq.${other.id},user_b.eq.${me.id})`).maybeSingle();
  if (ce || !conv) { pendingError = ce ? ce.message : 'No se encontró la conversación.'; return viewHome(); }
  R(`<div class="chat">
    <div class="chat-top"><button class="link" id="back">‹ Volver</button>${ava(other)}<div><b>${esc(other.display_name)}</b><div class="muted" style="color:${esc(other.color)}">${esc((MOODS[other.mood]||['—'])[0])}</div></div></div>
    <p class="muted" id="live" style="margin:0;font-size:12px">Conectando…</p>
    <div class="msgs" id="msgs"></div>
    <p id="msg" role="status"></p>
    <div class="replybar" id="replybar" hidden><span id="replytxt"></span><button class="link" id="replyx" aria-label="Cancelar respuesta">✕</button></div>
    <button class="link" id="cancel" hidden>Cancelar grabación</button>
    <div class="bar"><input id="txt" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje"><button class="send" id="mic" style="background:var(--vi)">Grabar</button><button class="send" id="send">Enviar</button></div>
  </div>`);
  $('#app').className = 'full';
  const seen = new Map();
  let replying = null;
  let poll = null, left = false;
  const tick = m => m.status === 'read' ? '✓✓ Leído' : m.status === 'delivered' ? '✓✓' : '✓';
  const els = new Map(), urls = new Map(), quotes = new Map();
  let lastDay = '', lastAt = '';
  const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dayLabel = d => {
    const now = new Date(), diff = Math.round((sod(now) - sod(d)) / 864e5);
    let t;
    if (diff === 0) t = 'Hoy';
    else if (diff === 1) t = 'Ayer';
    else if (diff > 1 && diff < 7) t = d.toLocaleDateString('es', { weekday: 'long' });
    else t = d.toLocaleDateString('es', { day: 'numeric', month: 'long', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  const audioSrc = async (m, a) => {
    if (!urls.has(m.audio_path)) {
      const { data, error } = await sb.storage.from('audios').createSignedUrl(m.audio_path, 3600);
      if (error) { const sp = document.createElement('span'); sp.textContent = 'No se pudo cargar el audio.'; a.replaceWith(sp); return; }
      urls.set(m.audio_path, data.signedUrl);
    }
    a.src = urls.get(m.audio_path);
  };
  const delMsg = async m => {
    if (!confirm('¿Eliminar este mensaje para todos?')) return;
    const { data, error } = await sb.rpc('delete_message', { p_id: m.id });
    if (error) return msg(error.message);
    if (data) sb.storage.from('audios').remove([data]);
    seen.set(m.id, { ...seen.get(m.id), deleted_at: new Date().toISOString(), body: null, audio_path: null });
    draw();
  };
  const fill = (el, m, mine) => {
    el.innerHTML = ''; el.dataset.del = m.deleted_at ? '1' : '';
    if (m.deleted_at) {
      const sp = document.createElement('span'); sp.style.fontStyle = 'italic'; sp.textContent = 'Mensaje eliminado'; el.appendChild(sp);
    } else {
      const tgt = m.reply_to ? seen.get(m.reply_to) : null;
      if (tgt) {
        const q = document.createElement('div'); q.className = 'quote';
        q.textContent = tgt.deleted_at ? 'Mensaje eliminado' : (tgt.sender_id === me.id ? 'Tú' : other.display_name) + ': ' + (tgt.kind === 'audio' ? 'Audio' : (tgt.body || '').slice(0, 80));
        q.onclick = () => { const te = els.get(tgt.id); if (te) { te.scrollIntoView({ block: 'center' }); te.classList.add('flash'); setTimeout(() => te.classList.remove('flash'), 1200); } };
        if (!quotes.has(tgt.id)) quotes.set(tgt.id, []);
        quotes.get(tgt.id).push(q); el.appendChild(q);
      }
      if (m.kind === 'audio') { const a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; el.appendChild(a); audioSrc(m, a); }
      else { const sp = document.createElement('span'); sp.textContent = m.body; el.appendChild(sp); }
    }
    const sm = document.createElement('small');
    const meta = document.createElement('span'); meta.className = 'meta'; sm.appendChild(meta);
    if (!m.deleted_at) {
      const rp = document.createElement('button'); rp.className = 'rp'; rp.textContent = 'Responder'; rp.onclick = () => setReply(m); sm.appendChild(rp);
      if (mine) { const dl = document.createElement('button'); dl.className = 'rp'; dl.textContent = 'Eliminar'; dl.onclick = () => delMsg(m); sm.appendChild(dl); }
    }
    el.appendChild(sm);
  };
  const draw = again => {
    const box = $('#msgs'); if (!box) return;
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const rows = [...seen.values()].sort((a, b) => a.created_at < b.created_at ? -1 : 1);
    let stale = false;
    rows.forEach(m => {
      const mine = m.sender_id === me.id, d = new Date(m.created_at);
      const t = d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
      let el = els.get(m.id);
      if (!el) {
        if (m.created_at < lastAt) { stale = true; return; }
        if (d.toDateString() !== lastDay) {
          const sep = document.createElement('div'); sep.className = 'day'; sep.textContent = dayLabel(d); box.appendChild(sep);
          lastDay = d.toDateString();
        }
        lastAt = m.created_at;
        el = document.createElement('div'); el.className = 'b ' + (mine ? 'me' : 'ot');
        if (mine) el.style.background = profile.color;
        fill(el, m, mine); els.set(m.id, el); box.appendChild(el);
      } else if (!!m.deleted_at !== (el.dataset.del === '1')) {
        fill(el, m, mine);
        (quotes.get(m.id) || []).forEach(q => { q.textContent = 'Mensaje eliminado'; });
      }
      el.querySelector('.meta').textContent = t + (mine ? ' · ' + tick(m) : '');
    });
    if (stale && !again) { box.innerHTML = ''; els.clear(); quotes.clear(); lastDay = ''; lastAt = ''; return draw(true); }
    if (atEnd) box.scrollTop = box.scrollHeight;
  };
  const markRead = async () => {
    const ids = [...seen.values()].filter(m => m.sender_id !== me.id && m.status !== 'read').map(m => m.id);
    if (!ids.length) return;
    const { error } = await sb.from('messages').update({ status: 'read' }).in('id', ids);
    if (!error) { ids.forEach(id => { seen.get(id).status = 'read'; }); draw(); }
  };
  const load = async () => {
    const { data, error } = await sb.from('messages').select('*').eq('conversation_id', conv.id).order('created_at').limit(200);
    if (error) return msg(error.message);
    data.forEach(m => seen.set(m.id, m)); draw(); markRead();
  };
  const ch = sb.channel('chat-' + conv.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `conversation_id=eq.${conv.id}` }, p => {
      if (!p.new || !p.new.id) return;
      seen.set(p.new.id, p.new); draw(); markRead();
    })
    .subscribe((st, err) => {
      const lv = $('#live');
      if (st === 'SUBSCRIBED') { clearInterval(poll); poll = null; load(); if (lv) lv.textContent = 'En vivo'; }
      else if (!left) {
        if (lv) lv.textContent = 'Sin conexión en vivo (' + st + (err ? ': ' + err.message : '') + '). Actualizando cada 3 s.';
        if (!poll) poll = setInterval(load, 3000);
      }
    });
  poll = setInterval(load, 3000); // respaldo si el tiempo real no conecta
  const wake = () => { if (!left) load(); };
  const onVis = () => { if (document.visibilityState === 'visible') wake(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('online', wake); window.addEventListener('focus', wake);
  const safety = setInterval(wake, 20000);
  load();
  const send = async () => {
    const body = $('#txt').value.trim(); if (!body) return;
    $('#txt').value = '';
    const { data, error } = await sb.from('messages').insert({ conversation_id: conv.id, sender_id: me.id, kind: 'text', body, reply_to: replying ? replying.id : null }).select().single();
    if (error) { $('#txt').value = body; return msg(error.message); }
    clearReply(); seen.set(data.id, data); draw(); $('#msgs').scrollTop = $('#msgs').scrollHeight;
  };
  const clearReply = () => { replying = null; $('#replybar').hidden = true; };
  const setReply = m => {
    replying = m;
    $('#replytxt').textContent = 'Respondiendo a ' + (m.sender_id === me.id ? 'ti' : other.display_name) + ': ' + (m.kind === 'audio' ? 'Audio' : (m.body || '').slice(0, 60));
    $('#replybar').hidden = false; $('#txt').focus();
  };
  $('#replyx').onclick = clearReply;
  let rec = null, chunks = [], timer = null, t0 = 0;
  const micBtn = $('#mic'), cancelBtn = $('#cancel');
  const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  const sendAudio = async blob => {
    if (blob.size < 1000) return msg('El audio es muy corto.');
    const base = (blob.type || 'audio/webm').split(';')[0];
    const ext = base.includes('mp4') ? 'm4a' : base.includes('ogg') ? 'ogg' : base.includes('mpeg') ? 'mp3' : 'webm';
    const path = `${conv.id}/${crypto.randomUUID()}.${ext}`;
    msg('Enviando audio…');
    const up = await sb.storage.from('audios').upload(path, blob, { contentType: base });
    if (up.error) return msg('No se pudo subir: ' + up.error.message);
    const { data, error } = await sb.from('messages').insert({ conversation_id: conv.id, sender_id: me.id, kind: 'audio', audio_path: path, reply_to: replying ? replying.id : null }).select().single();
    if (error) return msg(error.message);
    msg(''); clearReply(); seen.set(data.id, data); draw(); $('#msgs').scrollTop = $('#msgs').scrollHeight;
  };
  const startRec = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) return msg('Este navegador no permite grabar audio.');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return msg('Permite el micrófono en el navegador para grabar.'); }
    chunks = [];
    const r = new MediaRecorder(stream); rec = r;
    r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    r.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(timer); timer = null;
      micBtn.textContent = 'Grabar'; micBtn.classList.remove('rec'); cancelBtn.hidden = true;
      if (!r.cancelled) await sendAudio(new Blob(chunks, { type: r.mimeType }));
    };
    r.start(); t0 = Date.now(); msg('');
    micBtn.classList.add('rec'); micBtn.textContent = 'Enviar · 0:00'; cancelBtn.hidden = false;
    timer = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      micBtn.textContent = 'Enviar · ' + fmt(sec);
      if (sec >= 60) r.stop();
    }, 250);
  };
  micBtn.onclick = () => { if (rec && rec.state === 'recording') rec.stop(); else startRec(); };
  cancelBtn.onclick = () => { if (rec && rec.state === 'recording') { rec.cancelled = true; rec.stop(); } };
  $('#send').onclick = send;
  $('#txt').onkeydown = e => { if (e.key === 'Enter') send(); };
  $('#back').onclick = () => { if (rec && rec.state === 'recording') { rec.cancelled = true; rec.stop(); } left = true; clearInterval(poll); clearInterval(safety); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', wake); window.removeEventListener('focus', wake); sb.removeChannel(ch); viewHome(); };
}

boot();
</script>
